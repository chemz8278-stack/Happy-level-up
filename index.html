<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise! 🎁</title>
    <style>
        body { background: linear-gradient(135deg, #ffeaa7 0%, #ff7675 100%); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 95vh; }
        .card { background: white; padding: 40px 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); max-width: 400px; width: 100%; }
        h1 { color: #d63031; font-size: 2rem; margin-bottom: 10px; }
        p { color: #2d3436; font-size: 1.1rem; margin-bottom: 25px; }
        .cake { font-size: 6rem; margin: 20px 0; animation: float 2.5s ease-in-out infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .open-btn { background-color: #6c5ce7; color: white; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: transform 0.2s, background-color 0.2s; text-decoration: none; display: inline-block; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4); }
        .open-btn:hover { background-color: #5b4cc4; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>You Have a Message! 💌</h1>
        <p>Someone sent you a special greeting.</p>
        <div class="cake">🎂</div>
        <br>
        <a href="wish.html" class="open-btn">Click to Open ✨</a>
    </div>
</body>
</html>
